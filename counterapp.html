<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body{
            background-color: bisque;
            text-align: center;
            font-family: cursive;
            font-size: 40px;
        }
        button{
            border-radius: 10px;
        }
    </style>
  </head>
  <body>
   <BR><BR>
    <h1 class="container card bg-warning text-light p-4 text-align-center"><strong>COUNTER APP</strong></h1>
    <br>
    <div class="counter">
       
        <p>
            <input  id="numberbox" value="0">
            <div id="incbox" class="incbox"></div>
        </p>
        
       
    </div>
    <br>
    <button class="p-4 bg-primary text-light " onclick="increase()" id="increase">INCREASE</button>
    <button class="p-4 bg-danger text-light " onclick="decrease()" id="decrease">DECREASE</button>
    <button class="p-4 bg-secondary text-light" onclick="restart()"id="restart">RESTART</button>
    <script>
      var initial = 0;
      function increase(){
        initial = initial + 1;
        document.getElementById('numberbox').value = initial;
      }
      function decrease(){
        initial = initial - 1;
        document.getElementById('numberbox').value = initial;
      }
      function restart(){
        initial = 0;
        document.getElementById('numberbox').value = initial;
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
